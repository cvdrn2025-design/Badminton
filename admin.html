<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Kelola Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Teko:wght@600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
    body { background: #0f172a; padding: 20px; color: #f8fafc; }
    .container { max-width: 900px; margin: 0 auto; }
    
    /* Header */
    .header {
      background: #1e293b;
      border-radius: 10px;
      padding: 15px 20px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-family: 'Teko', sans-serif; font-size: 28px; color: #ff4b2b; }
    
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-red { background: #ff416c; color: white; }
    .btn-green { background: #11998e; color: white; }
    .btn-blue { background: #00c6ff; color: white; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    
    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    
    .input {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: white;
      font-size: 14px;
      margin-bottom: 10px;
    }
    
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; }
    th { color: #ff4b2b; font-family: 'Teko', sans-serif; font-size: 16px; }
    
    .role { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .role-admin { background: #ff416c20; color: #ff416c; }
    .role-wasit { background: #00c6ff20; color: #00c6ff; }
    .role-viewer { background: #94a3b820; color: #94a3b8; }
    
    .status { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .status-active { background: #38ef7d20; color: #38ef7d; }
    .status-inactive { background: #ff416c20; color: #ff416c; }
    
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
    }
    .modal-content h3 { margin-bottom: 15px; color: #ff4b2b; font-family: 'Teko', sans-serif; font-size: 22px; }
    
    .alert {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 13px;
      display: none;
    }
    .alert-success { background: #38ef7d20; color: #38ef7d; border: 1px solid #38ef7d; }
    .alert-error { background: #ff416c20; color: #ff416c; border: 1px solid #ff416c; }
  </style>
</head>
<body>
  <!-- Modal Edit -->
  <div id="editModal" class="modal" onclick="closeModal('editModal')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>Edit Lisensi</h3>
      <input type="text" id="editKey" class="input" readonly style="background:#0f172a; color:#fff;">
      <select id="editRole" class="input">
        <option value="admin">Admin</option>
        <option value="wasit">Wasit</option>
        <option value="viewer">Viewer</option>
      </select>
      <select id="editStatus" class="input">
        <option value="active">Aktif</option>
        <option value="inactive">Nonaktif</option>
      </select>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-green" style="flex:1;" onclick="saveEdit()">Simpan</button>
        <button class="btn btn-red" style="flex:1;" onclick="closeModal('editModal')">Batal</button>
      </div>
    </div>
  </div>

  <!-- Modal Tambah -->
  <div id="addModal" class="modal" onclick="closeModal('addModal')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>Buat Password</h3>
      <input type="text" id="newKey" class="input" placeholder="Kode (kosongkan untuk otomatis)">
      <select id="newRole" class="input">
        <option value="admin">Admin</option>
        <option value="wasit">Wasit</option>
        <option value="viewer">Viewer</option>
      </select>
      <button class="btn btn-green" style="width:100%;" onclick="addLicense()">Buat</button>
      <button class="btn btn-red" style="width:100%; margin-top:10px;" onclick="closeModal('addModal')">Batal</button>
    </div>
  </div>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>⚙️ Kelola Password</h1>
      <button class="btn btn-sm btn-red" onclick="logout()">Keluar</button>
    </div>

    <!-- Statistik -->
    <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px;">
      <div class="card" style="text-align:center; padding:10px;">
        <div style="font-family:'Teko'; font-size:30px; color:#ff4b2b;" id="total">0</div>
        <div style="font-size:11px; color:#94a3b8;">Total</div>
      </div>
      <div class="card" style="text-align:center; padding:10px;">
        <div style="font-family:'Teko'; font-size:30px; color:#38ef7d;" id="aktif">0</div>
        <div style="font-size:11px; color:#94a3b8;">Aktif</div>
      </div>
      <div class="card" style="text-align:center; padding:10px;">
        <div style="font-family:'Teko'; font-size:30px; color:#ff416c;" id="nonaktif">0</div>
        <div style="font-size:11px; color:#94a3b8;">Nonaktif</div>
      </div>
    </div>

    <!-- Tombol Tambah -->
    <div style="margin-bottom: 15px;">
      <button class="btn btn-green" onclick="openModal('addModal')">+ Tambah Password</button>
    </div>

    <!-- Alert -->
    <div id="alert" class="alert"></div>

    <!-- Tabel -->
    <div class="card">
      <input type="text" class="input" placeholder="Cari kode..." oninput="cari()" id="search">
      
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Kode</th>
              <th>Role</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="list">
            <tr><td colspan="4" style="text-align:center; color:#94a3b8;">Memuat...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCMvemJT1b6fy5D_s8Hl9WOwXZmsZ096jE",
      authDomain: "drawing-match-ac69a.firebaseapp.com",
      databaseURL: "https://turnamen-badminton-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "drawing-match-ac69a",
      storageBucket: "drawing-match-ac69a.firebasestorage.app",
      messagingSenderId: "22800670068",
      appId: "1:22800670068:web:6bc373b99331c8e0bca021"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let semuaData = [];
    let currentEdit = '';

    // Cek login admin
    if (!sessionStorage.getItem('admin_login')) {
      const pass = prompt("Password Admin:");
      if (pass === "ADMIN123") {
        sessionStorage.setItem('admin_login', 'true');
      } else {
        alert("Password salah!");
        window.location.href = "index.html";
      }
    }

    function logout() {
      sessionStorage.removeItem('admin_login');
      window.location.href = "index.html";
    }

    // Load data
    db.ref('licenses').on('value', snap => {
      jikaAda(snap) {
        semuaData = Object.entries(snap.val()).map(([key, val]) => ({
          key, role: val.role || 'viewer', status: val.status || 'active'
        }));
      } else {
        semuaData = [];
      }
      updateStatistik();
      tampilkan();
    });

    function updateStatistik() {
      document.getElementById('total').textContent = semuaData.length;
      document.getElementById('aktif').textContent = semuaData.filter(d => d.status === 'active').length;
      document.getElementById('nonaktif').textContent = semuaData.filter(d => d.status === 'inactive').length;
    }

    function tampilkan() {
      const cari = document.getElementById('search').value.toLowerCase();
      const hasil = semuaData.filter(d => d.key.toLowerCase().includes(cari));
      
      const list = document.getElementById('list');
      if (hasil.length === 0) {
        list.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#94a3b8;">Tidak ada data</td></tr>';
        return;
      }

      list.innerHTML = hasil.map(d => `
        <tr>
          <td><strong>${d.key}</strong></td>
          <td><span class="role role-${d.role}">${d.role.toUpperCase()}</span></td>
          <td><span class="status status-${d.status}">${d.status === 'active' ? 'AKTIF' : 'NONAKTIF'}</span></td>
          <td>
            <button class="btn btn-sm btn-blue" onclick="edit('${d.key}')">Edit</button>
            <button class="btn btn-sm ${d.status === 'active' ? 'btn-red' : 'btn-green'}" onclick="toggle('${d.key}')">${d.status === 'active' ? 'Nonaktif' : 'Aktif'}</button>
            <button class="btn btn-sm btn-red" onclick="hapus('${d.key}')">Hapus</button>
          </td>
        </tr>
      `).join('');
    }

    function cari() { tampilkan(); }

    // Modal
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // Tambah
    function addLicense() {
      let key = document.getElementById('newKey').value.trim().toUpperCase();
      const role = document.getElementById('newRole').value;
      
      if (!key) key = 'PW-' + Math.random().toString(36).substr(2, 6).toUpperCase();
      
      if (semuaData.some(d => d.key === key)) {
        alert('Kode sudah ada!');
        return;
      }

      db.ref('licenses/' + key).set({
        role, status: 'active', createdAt: Date.now()
      }).then(() => {
        closeModal('addModal');
        document.getElementById('newKey').value = '';
        alert('Password berhasil dibuat!');
      });
    }

    // Edit
    function edit(key) {
      const data = semuaData.find(d => d.key === key);
      currentEdit = key;
      document.getElementById('editKey').value = key;
      document.getElementById('editRole').value = data.role;
      document.getElementById('editStatus').value = data.status;
      openModal('editModal');
    }

    function saveEdit() {
      db.ref('licenses/' + currentEdit).update({
        role: document.getElementById('editRole').value,
        status: document.getElementById('editStatus').value
      }).then(() => {
        closeModal('editModal');
        alert('Berhasil diupdate!');
      });
    }

    // Toggle status
    function toggle(key) {
      const data = semuaData.find(d => d.key === key);
      const newStatus = data.status === 'active' ? 'inactive' : 'active';
      
      if (confirm('Ubah status menjadi ' + (newStatus === 'active' ? 'AKTIF' : 'NONAKTIF') + '?')) {
        db.ref('licenses/' + key).update({ status: newStatus });
      }
    }

    // Hapus
    function hapus(key) {
      if (confirm('Hapus password ' + key + '?')) {
        db.ref('licenses/' + key).remove();
      }
    }
  </script>
</body>
</html>
