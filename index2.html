<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Turnamen Sporty</title>
  <!-- Google Font Sporty (Teko & Montserrat) -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* Reset & Dasar */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: #0f172a; /* Latar belakang gelap futuristik/sporty */
      padding: 15px;
      color: #f8fafc;
    }

    /* Container Utama */
    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    /* Gambar Header Banner */
    .header-banner {
      width: 100%;
      height: 160px;
      overflow: hidden;
      border-radius: 12px;
      margin-bottom: 20px;
      background-color: #1e293b;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border: 2px solid #334155;
    }

    .header-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 14px;
      border: none;
      background: #1e293b;
      color: #94a3b8;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      font-style: italic;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid #334155;
    }

    .tab-btn:hover {
      color: #fff;
      transform: translateY(-2px);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
    }

    /* Card Box */
    .card {
      background: #1e293b;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      margin-bottom: 20px;
      border: 1px solid #334155;
    }

    .card h2 {
      font-family: 'Teko', sans-serif;
      font-size: 26px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 15px;
      color: #f1f5f9;
      border-left: 4px solid #ff4b2b;
      padding-left: 10px;
    }

    /* Form Input */
    .form-group {
      margin-bottom: 14px;
    }

    .form-control {
      width: 100%;
      padding: 12px 15px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 14px;
      color: #fff;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: #ff4b2b;
    }

    /* --- DESAIN TOMBOL SPORTY --- */
    .btn {
      position: relative;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      font-size: 14px;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-align: center;
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Efek Kilat Cahaya Saat Di-hover */
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: 0.5s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.02);
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
    }

    /* Varian Warna Sporty dengan Gradien & Glow */
    .btn-red {
      background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
    }

    .btn-red:hover {
      box-shadow: 0 6px 20px rgba(255, 75, 43, 0.6);
    }

    .btn-blue {
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
    }

    .btn-blue:hover {
      box-shadow: 0 6px 20px rgba(0, 114, 255, 0.6);
    }

    .btn-green {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: #0f172a;
      box-shadow: 0 4px 15px rgba(56, 239, 125, 0.4);
    }

    .btn-green:hover {
      box-shadow: 0 6px 20px rgba(56, 239, 125, 0.6);
    }

    .btn-full {
      width: 100%;
    }

    /* Media Options */
    .media-buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 10px;
    }

    .media-buttons .btn {
      flex: 1;
    }

    .info-text {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 15px;
    }

    /* Preview Foto */
    .photo-preview {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
      border: 2px solid #334155;
    }

    /* Tab Content Visibility */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- GAMBAR HEADER BANNER -->
    <div class="header-banner">
      <img src="header1.png" alt="Header Banner Turnamen">
    </div>

    <!-- Tab Navigasi Sporty -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="openTab('pendaftaran', event)">🚩 Pendaftaran</button>
      <button class="tab-btn" onclick="openTab('jadwal', event)">📊 Jadwal</button>
      <button class="tab-btn" onclick="openTab('skor', event)">🏆 Skor</button>
    </div>

    <!-- Halaman Pendaftaran -->
    <div id="pendaftaran" class="tab-content active">
      
      <!-- Form Informasi Event -->
      <form class="card" onsubmit="simpanInfo(event)">
        <h2>Informasi Event</h2>
        <div class="form-group">
          <input type="text" id="namaEvent" class="form-control" placeholder="Nama Event" required>
        </div>
        <div class="form-group">
          <input type="text" id="penyelenggara" class="form-control" placeholder="Penyelenggara" required>
        </div>
        <div class="form-group">
          <input type="text" id="lokasi" class="form-control" placeholder="Lokasi" required>
        </div>
        <button type="submit" class="btn btn-red">Simpan Info</button>
      </form>

      <!-- Form Daftar Peserta -->
      <form class="card" onsubmit="daftarPeserta(event)">
        <h2>Daftar Peserta</h2>
        <div class="form-group">
          <input type="text" id="namaPeserta" class="form-control" placeholder="Nama Peserta" required>
        </div>
        <div class="form-group">
          <input type="tel" id="noTelp" class="form-control" placeholder="No Telepon/WA" required>
        </div>
        <div class="form-group">
          <input type="text" id="alamatPeserta" class="form-control" placeholder="Alamat" required>
        </div>
        
        <!-- Input File Kamera & Galeri -->
        <input type="file" id="inputGaleri" accept="image/*" style="display: none;" onchange="previewImage(event)">
        <input type="file" id="inputKamera" accept="image/*" capture="environment" style="display: none;" onchange="previewImage(event)">

        <div class="media-buttons">
          <button type="button" class="btn btn-blue" onclick="document.getElementById('inputGaleri').click()">🖼️ Galeri</button>
          <button type="button" class="btn btn-green" onclick="document.getElementById('inputKamera').click()">📷 Kamera</button>
        </div>
        
        <p id="infoFoto" class="info-text">Belum ada foto</p>
        <img id="imgPreview" class="photo-preview" alt="Preview Foto Peserta">

        <button type="submit" class="btn btn-red btn-full" style="margin-top: 15px;">Daftar Peserta</button>
      </form>

    </div>

    <!-- Tab Jadwal -->
    <div id="jadwal" class="tab-content">
      <div class="card">
        <h2>Jadwal & Turnamen</h2>
        <p style="color: #94a3b8;">Konten jadwal pertandingan akan ditampilkan di sini.</p>
      </div>
    </div>

    <!-- Tab Skor -->
    <div id="skor" class="tab-content">
      <div class="card">
        <h2>Papan Skor</h2>
        <p style="color: #94a3b8;">Papan skor turnamen akan ditampilkan di sini.</p>
      </div>
    </div>
  </div>

  <script>
    // Tab Handler
    function openTab(tabId, evt) {
      const contents = document.querySelectorAll('.tab-content');
      contents.forEach(content => content.classList.remove('active'));

      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(button => button.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');
    }

    // Camera & Gallery Preview
    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgPreview = document.getElementById('imgPreview');
          const infoFoto = document.getElementById('infoFoto');
          
          imgPreview.src = e.target.result;
          imgPreview.style.display = 'block';
          infoFoto.textContent = 'Foto berhasil diambil: ' + file.name;
        };
        reader.readAsDataURL(file);
      }
    }

    // Submit Actions
    function simpanInfo(event) {
      event.preventDefault();
      const nama = document.getElementById('namaEvent').value;
      alert('Informasi Event "' + nama + '" berhasil disimpan!');
    }

    function daftarPeserta(event) {
      event.preventDefault();
      const nama = document.getElementById('namaPeserta').value;
      alert('Peserta "' + nama + '" berhasil didaftarkan!');
    }
  </script>

</body>
</html>
