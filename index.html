<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Turnamen</title>
  <style>
    /* Reset & Dasar */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      padding: 15px;
      color: #333;
    }

    /* Container Utama */
    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    /* Gambar Header Banner */
    .header-banner {
      width: 100%;
      height: 160px;
      overflow: hidden;
      border-radius: 12px;
      margin-bottom: 15px;
      background-color: #ddd;
    }

    .header-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
      overflow-x: auto;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ddd;
      background-color: #fff;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active {
      background-color: #d9534f;
      color: white;
      border-color: #d9534f;
    }

    /* Card Box */
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    /* Form Input */
    .form-group {
      margin-bottom: 12px;
    }

    .form-control {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .form-control:focus {
      border-color: #0275d8;
    }

    /* Buttons */
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-red {
      background-color: #d9534f;
      color: white;
    }

    .btn-blue {
      background-color: #0275d8;
      color: white;
    }

    .btn-green {
      background-color: #5cb85c;
      color: white;
    }

    .btn-full {
      width: 100%;
    }

    /* Media Options */
    .media-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .info-text {
      font-size: 12px;
      color: #777;
      margin-bottom: 15px;
    }

    /* Tab Content Visibility */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- GAMBAR HEADER BANNER -->
    <div class="header-banner">
      <img src="header.1.png" alt="Header Banner Turnamen">
    </div>

    <!-- Tab Navigasi -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="openTab('pendaftaran', event)">🚩 Pendaftaran</button>
      <button class="tab-btn" onclick="openTab('jadwal', event)">📊 Jadwal & Turnamen</button>
      <button class="tab-btn" onclick="openTab('skor', event)">🏆 Papan Skor</button>
    </div>

    <!-- Halaman Pendaftaran -->
    <div id="pendaftaran" class="tab-content active">
      
      <!-- Card 1: Informasi Event -->
      <div class="card">
        <h2>Informasi Event</h2>
        <div class="form-group">
          <input type="text" class="form-control" placeholder="Nama Event">
        </div>
        <div class="form-group">
          <input type="text" class="form-control" placeholder="Penyelenggara">
        </div>
        <div class="form-group">
          <input type="text" class="form-control" placeholder="Lokasi">
        </div>
        <button class="btn btn-red">Simpan Info</button>
      </div>

      <!-- Card 2: Daftar Peserta -->
      <div class="card">
        <h2>Daftar Peserta</h2>
        <div class="form-group">
          <input type="text" class="form-control" placeholder="Nama Peserta">
        </div>
        <div class="form-group">
          <input type="tel" class="form-control" placeholder="No Telepon/WA">
        </div>
        <div class="form-group">
          <input type="text" class="form-control" placeholder="Alamat">
        </div>
        
        <div class="media-buttons">
          <button class="btn btn-blue">🖼️ Galeri</button>
          <button class="btn btn-green">📷 Kamera</button>
        </div>
        
        <p class="info-text">Belum ada foto</p>

        <button class="btn btn-red btn-full">Daftar Peserta</button>
      </div>

    </div>

    <!-- Tab Jadwal -->
    <div id="jadwal" class="tab-content">
      <div class="card">
        <h2>Jadwal & Turnamen</h2>
        <p>Konten jadwal akan muncul di sini.</p>
      </div>
    </div>

    <!-- Tab Skor -->
    <div id="skor" class="tab-content">
      <div class="card">
        <h2>Papan Skor</h2>
        <p>Konten papan skor akan muncul di sini.</p>
      </div>
    </div>
  </div>

  <script>
    function openTab(tabId, evt) {
      const contents = document.querySelectorAll('.tab-content');
      contents.forEach(content => content.classList.remove('active'));

      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(button => button.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');
    }
  </script>

</body>
</html>
